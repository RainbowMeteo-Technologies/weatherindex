version: "3.7"

services:

  accuweather-downloader:
    profiles:
      - metar
    image: weatherindex/weatherindex:sensors-${METRICS_DOCKER_VERSION}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./.volume/download/metar/:/.download/metar/
    command: |
      python -m sensors
      --download-path ./download/metar
      --storage-uri ${S3_URI_METAR}
      metar

  geosphere-downloader:
    profiles:
      - geosphere
    image: weatherindex/weatherindex:sensors-${METRICS_DOCKER_VERSION}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./.volume/download/geosphere/:/.download/geosphere/
    command: |
      python -m sensors
      --download-path ./download/geosphere
      --storage-uri ${S3_URI_GEOSPHERE}
      geosphere
      --api-endpoint https://dataset.api.hub.geosphere.at/v1/station/historical/tawes-v1-10min
      --timeout ${GEOSPHERE_TIMEOUT:-30}
